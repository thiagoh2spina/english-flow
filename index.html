        body { background-color: #0B0F17; color: #F1F5F9; font-family: 'Inter', sans-serif; overflow-x: hidden; }

        .duo-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
        .glass-card { background: rgba(21, 28, 40, 0.88); backdrop-filter: blur(12px); border: 1px solid rgba(38, 49, 71, 0.9); }

        ::-webkit-scrollbar-track { background: #0B0F17; }
        ::-webkit-scrollbar-thumb { background: #263147; border-radius: 4px; }
        details > summary { cursor: pointer; list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        #toast { transition: opacity .25s ease; }
        #audio-bar { padding-bottom: max(0.5rem, env(safe-area-inset-bottom)); }
        .speed-btn { border: 1px solid transparent; }

<body class="min-h-screen flex flex-col selection:bg-duo-blue selection:text-white">

<header class="sticky top-0 z-40 bg-[#0B0F17]/95 backdrop-blur-md border-b border-tech-border shadow-lg shadow-black/40">
    <div class="relative max-w-6xl mx-auto pl-4 pr-16 py-3 flex flex-wrap items-center justify-between gap-3">
        <button type="button" id="menu-btn" aria-label="Menu: versões, voz e configuração" class="absolute top-3 right-3 w-10 h-10 rounded-xl bg-tech-card border border-tech-border text-white text-2xl font-extrabold leading-none flex items-center justify-center">⋮<span id="net-dot" class="absolute -top-1 -right-1 w-3.5 h-3.5 rounded-full border-2 border-[#0B0F17] bg-slate-500"></span></button>
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-duo-green to-emerald-600 flex items-center justify-center shadow-lg shadow-duo-green/20 shrink-0">
                <i class="fa-solid fa-microchip text-white text-lg"></i>
            </div>
            <div>
                <div class="flex items-center gap-2 flex-wrap">
                    <h1 class="font-extrabold text-base sm:text-lg tracking-tight text-white">ENGLISH FLOW LAB</h1>
                    <span id="hudDay" class="px-2 py-0.5 text-xs font-mono font-bold bg-duo-blue/20 text-duo-blue border border-duo-blue/40 rounded-md">DIA 01</span>
                </div>
                <p id="hudTopic" class="text-xs text-slate-400 hidden sm:block">Inglês para a fábrica, o treino, as finanças e o TCC</p>
            </div>
        </div>
        <div class="flex items-center gap-2 w-full sm:w-auto flex-nowrap overflow-x-auto tabs-scroll-container pb-1 -mb-1">
            <div class="shrink-0 flex items-center gap-1.5 px-2.5 py-1 rounded-xl bg-amber-500/10 border border-amber-500/30 text-xs font-mono" title="Volume extra da voz">
                <i class="fa-solid fa-volume-high text-duo-amber"></i>
                <select id="audio-boost-select" class="bg-transparent text-duo-amber font-bold outline-none cursor-pointer">
                    <option value="2.5" class="bg-[#0B0F17]">2.5x ALTO</option>
                    <option value="3.5" class="bg-[#0B0F17]" selected>3.5x WAV</option>
                    <option value="4.5" class="bg-[#0B0F17]">4.5x MAX</option>
                </select>
            </div>
            <label class="shrink-0 flex items-center gap-1.5 px-2.5 py-1 rounded-xl bg-duo-blue/10 border border-duo-blue/30 text-xs font-mono" title="Velocidade da voz (0,5x a 1,5x)">
                <span class="text-duo-blue">⏱</span>
                <select id="speed-select" class="bg-transparent text-duo-blue font-bold outline-none cursor-pointer">
                    <option value="0.5" class="bg-[#0B0F17]">0.5x</option><option value="0.75" class="bg-[#0B0F17]">0.75x</option><option value="1" class="bg-[#0B0F17]">1.0x</option><option value="1.25" class="bg-[#0B0F17]">1.25x</option><option value="1.5" class="bg-[#0B0F17]">1.5x</option>
                </select>
            </label>
            <button type="button" data-tab="tab6" class="shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-amber-500/10 border border-amber-500/30 text-duo-amber font-bold text-sm" title="Dias seguidos">
                <i class="fa-solid fa-fire"></i><span id="hudStreak">0</span>
            </button>
            <button type="button" data-tab="tab6" class="shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-duo-green/10 border border-duo-green/30 text-duo-green font-bold text-sm" title="XP">
                <i class="fa-solid fa-bolt"></i><span id="hudXp">0</span><span class="text-xs font-normal text-emerald-200/80">XP</span>
            </button>
            <button type="button" data-tab="tab1" class="shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-purple-500/10 border border-purple-500/30 text-duo-purple font-bold text-sm" title="Precisão na 1ª tentativa">
                <i class="fa-solid fa-bullseye"></i><span id="hudAcc">—</span>
            </button>
        </div>
    </div>
    <div id="nav-tabs-bar" class="max-w-6xl mx-auto px-4 flex tabs-scroll-container border-t border-tech-border/60">
        <button data-tab="tab1" class="tab-btn flex items-center gap-2 px-4 py-3 text-xs sm:text-sm font-bold border-b-2 whitespace-nowrap"><i class="fa-solid fa-layer-group"></i><span>Lição</span></button>
        <button data-tab="tab2" class="tab-btn flex items-center gap-2 px-4 py-3 text-xs sm:text-sm font-bold border-b-2 whitespace-nowrap"><i class="fa-solid fa-book-open-reader"></i><span>Leitura</span></button>
        <button data-tab="tab3" class="tab-btn flex items-center gap-2 px-4 py-3 text-xs sm:text-sm font-bold border-b-2 whitespace-nowrap"><i class="fa-solid fa-headphones"></i><span>Ouvir</span></button>
        <button data-tab="tab5" class="tab-btn flex items-center gap-2 px-4 py-3 text-xs sm:text-sm font-bold border-b-2 whitespace-nowrap"><i class="fa-solid fa-lightbulb"></i><span>Dicas</span></button>
        <button data-tab="tab6" class="tab-btn flex items-center gap-2 px-4 py-3 text-xs sm:text-sm font-bold border-b-2 whitespace-nowrap"><i class="fa-solid fa-cloud-arrow-up"></i><span>Relatório</span></button>
    </div>
</header>

<main class="flex-1 max-w-6xl w-full mx-auto px-4 pt-6 pb-28">
    <section id="tab1" class="space-y-4 max-w-2xl mx-auto"></section>
    <section id="tab2" class="hidden space-y-4 max-w-2xl mx-auto"></section>

    <section id="tab6" class="hidden space-y-6"></section>

<!-- barra de áudio: pausar / continuar / parar / velocidade ao vivo -->
<div id="audio-bar" class="hidden fixed bottom-0 left-0 right-0 z-50 px-3 pt-2">
    <div class="max-w-xl mx-auto glass-card rounded-2xl px-3 py-2 flex items-center gap-2.5 shadow-2xl shadow-black/60 border-duo-green/40">
        <button type="button" id="ab-toggle" aria-label="Pausar" class="w-12 h-12 rounded-xl bg-duo-green text-slate-950 text-xl font-extrabold shrink-0">⏸</button>
        <div class="flex-1 min-w-0">
            <p id="ab-label" class="text-[11px] font-mono text-slate-300 truncate">Tocando</p>
            <div class="flex items-center gap-1 mt-1 text-[11px] font-mono" title="Muda a velocidade sem recomeçar">
                <button type="button" data-speed="0.5" class="speed-btn px-1.5 py-1 rounded-lg text-slate-400 font-bold">0.5</button>
                <button type="button" data-speed="0.75" class="speed-btn px-1.5 py-1 rounded-lg text-slate-400 font-bold">.75</button>

<script id="default-lesson" type="application/json">{"version":2,"day":1,"date":"2026-11-14","createdAt":0,"curriculumIndex":0,"cycle":1,"level":"A1 indo para A2","topic":"Verbo TO BE nos 3 tempos (am, is, are • was, were • will be)","curriculumTopic":"To be: am, is, are, was, were, will be","sound":"/ɪ/ x /iː/ e Dark L","repeat":false,"goal":"Usar o verbo to be no presente, no passado e no futuro para falar da fábrica, do treino e das finanças.","summary":"Hoje é o alicerce: am/is/are, was/were e will be, sempre com sujeito (It is…). Também treinamos pronome sujeito x objeto e três sons que mudam o sentido das palavras.","grammarPoints":["am / is / are no presente","was / were no passado","will be para todos no futuro","pergunta = inverter o verbo (Is it…?)","sujeito obrigatório (It is…)"],"vocabulary":[{"en":"online","pt":"ligado / conectado"},{"en":"stable","pt":"estável"},{"en":"ready","pt":"pronto"},{"en":"sensor","pt":"sensor"},{"en":"workout","pt":"treino"},{"en":"pull-up","pt":"barra fixa"},{"en":"interest rate","pt":"taxa de juros"},{"en":"dividends","pt":"dividendos"},{"en":"property","pt":"imóvel"},{"en":"yesterday","pt":"ontem"},{"en":"tomorrow","pt":"amanhã"},{"en":"debt-free","pt":"sem dívidas"}],"corrections":[],"pillars":[{"kicker":"Pilar 01 • Verbo do dia: TO BE","title":"Verbo TO BE (ser / estar) nos 3 tempos","badge":"Present • Past • Future","intro":"Todo sistema tem um \u003cb>estado atual\u003c/b> (presente), um \u003cb>histórico\u003c/b> (passado) e uma \u003cb>projeção\u003c/b> (futuro). Em inglês, o \u003cb>to be\u003c/b> faz o papel de \"ser\" e de \"estar\". Aprenda em blocos, já com a contração.","groups":[{"label":"1. SIMPLE PRESENT (hoje)","sub":"am / is / are","items":[{"head":"I am (I'm)","sub":"Neg: I'm not | Perg: Am I?","en":"I'm ready for the pull-up set.","pt":"Estou pronto para a série de barra."},{"head":"He / She / It is ('s)","sub":"Neg: isn't | Perg: Is it?","en":"The PLC is online and the signal is stable.","pt":"O CLP está online e o sinal está estável."},{"head":"You / We / They are ('re)","sub":"Neg: aren't | Perg: Are they?","en":"They are optical sensors, and we are the operators.","pt":"Eles são sensores ópticos, e nós somos os operadores."}]},{"label":"2. SIMPLE PAST (ontem)","sub":"was / were","items":[{"head":"I was","sub":"Neg: wasn't | Perg: Was I?","en":"Yesterday, I was at the cab paint shop.","pt":"Ontem, eu estava na pintura de cabines."},{"head":"He / She / It was","sub":"Neg: wasn't | Perg: Was it?","en":"The inflation rate was very high in 1993.","pt":"A taxa de inflação era muito alta em 1993."},{"head":"You / We / They were","sub":"Neg: weren't | Perg: Were they?","en":"The SQL tables were corrupted last night.","pt":"As tabelas SQL estavam corrompidas ontem à noite."}]},{"label":"3. SIMPLE FUTURE (amanhã)","sub":"will be (todos!)","items":[{"head":"I will be (I'll be)","sub":"Neg: won't be | Perg: Will I be?","en":"I'll be debt-free in five years.","pt":"Estarei livre de dívidas em cinco anos."},{"head":"He / She / It will be","sub":"Neg: won't be | Perg: Will it be?","en":"This property will be a great investment.","pt":"Este imóvel será um ótimo investimento."},{"head":"You / We / They will be","sub":"Neg: won't be | Perg: Will we be?","en":"Our dividends will be higher next year.","pt":"Nossos dividendos serão maiores no próximo ano."}]}],"callout":["\u003cb>Nunca omita o sujeito:\u003c/b> em português dizemos \"Está funcionando\"; em inglês o verbo precisa de sujeito: \u003cb>It is working\u003c/b>.","\u003cb>Idade e temperatura usam TO BE (não have):\u003c/b> \u003cb>The factory is 40 years old\u003c/b> (a fábrica tem 40 anos) e \u003cb>The motor is hot\u003c/b>."]},{"kicker":"Pilar 02 • Pronomes sujeito x objeto","title":"Quem FAZ a ação (sujeito) x quem RECEBE (objeto)","badge":"Input → Output","intro":"Antes do verbo: \u003cb>I, you, he, she, it, we, they\u003c/b>. Depois de verbo ou de preposição (to, for, with, at): \u003cb>me, you, him, her, it, us, them\u003c/b>.","groups":[{"label":"Pessoas","sub":"I → me • he → him • she → her","items":[{"head":"I → ME","en":"I monitor the PLC, and it sends alerts to me.","pt":"Eu monitoro o CLP, e ele envia alertas para mim."},{"head":"HE → HIM","en":"He is the senior engineer. I learned Ladder with him.","pt":"Ele é o engenheiro sênior. Aprendi Ladder com ele."},{"head":"SHE → HER","en":"She analyzes real estate, so I asked her about SAC.","pt":"Ela analisa imóveis, então perguntei a ela sobre o SAC."}]},{"label":"Coisas e grupos","sub":"it → it • we → us • they → them","items":[{"head":"IT → IT","en":"The sensor is new. It is accurate because I calibrated it.","pt":"O sensor é novo. Ele é preciso porque eu o calibrei."},{"head":"WE → US","en":"We train calisthenics, and it makes us stronger.","pt":"Nós treinamos calistenia, e isso nos deixa mais fortes."},{"head":"THEY → THEM","en":"They are Real Estate Funds. I buy them every month.","pt":"Eles são Fundos Imobiliários. Eu os compro todo mês."}]}],"callout":["Depois de preposição nunca use I/he/she/we/they: é \u003cb>with him\u003c/b>, \u003cb>to her\u003c/b>, \u003cb>for us\u003c/b>."]},{"kicker":"Pilar 05 • Sons do inglês","title":"Short I (/ɪ/) x Long E (/iː/) + Dark L (/ɫ/)","badge":"Musculatura da fala","intro":"Três sons que brasileiros costumam trocar. Ouça, repita em voz alta e exagere no começo.","groups":[{"label":"1. SHORT I (/ɪ/)","sub":"curto e relaxado","items":[{"head":"Lábios relaxados, sem sorrir","sub":"som curto entre \"i\" e \"ê\"","en":"It. Is. System. Gym. Bit. Dip.","pt":"It • Is • System • Gym • Bit • Dip"}]},{"label":"2. LONG E (/iː/)","sub":"longo e sorrindo","items":[{"head":"Estique os cantos da boca","sub":"segure o \"íí\"","en":"Read. Sheet. Yield. Peak.","pt":"Read • Sheet • Yield • Peak"}]},{"label":"3. DARK L (/ɫ/)","sub":"língua no céu da boca","items":[{"head":"Não arredonde os lábios em \"U\"","sub":"ponta da língua na gengiva de cima + fundo da língua erguido","en":"Will. Pull-up. Control. Capital.","pt":"Will • Pull-up • Control • Capital"}]}],"callout":[]}],"verb":"be","wordsIndex":1,"reviewWords":false,"words":[{"word":"today","pt":"hoje","tip":"Vai no começo ou no fim da frase e pede presente: \u003cb>Today I am…\u003c/b> / \u003cb>I am… today\u003c/b>.","sentences":[{"en":"I am at the factory today.","pt":"Estou na fábrica hoje.","area":"CLP & Automação"},{"en":"Are you at college today?","pt":"Você está na faculdade hoje?","area":"História"},{"en":"The ESP32 isn't connected today.","pt":"O ESP32 não está conectado hoje.","area":"CLP & Automação"},{"en":"Is the stock market open today?","pt":"A bolsa está aberta hoje?","area":"Investimentos"},{"en":"We are tired today.","pt":"Nós estamos cansados hoje.","area":"Calistenia"}]},{"word":"yesterday","pt":"ontem","tip":"Ontem pede passado: \u003cb>was\u003c/b> (I, he, she, it) ou \u003cb>were\u003c/b> (you, we, they).","sentences":[{"en":"I was at work yesterday.","pt":"Eu estava no trabalho ontem.","area":"CLP & Automação"},{"en":"Were you at home yesterday?","pt":"Você estava em casa ontem?","area":"Calistenia"},{"en":"The motor was too hot yesterday.","pt":"O motor estava quente demais ontem.","area":"CLP & Automação"},{"en":"Yesterday the data wasn't ready.","pt":"Ontem os dados não estavam prontos.","area":"Engenharia de Dados"},{"en":"Was the house for sale yesterday?","pt":"A casa estava à venda ontem?","area":"Imóveis"}]},{"word":"tomorrow","pt":"amanhã","tip":"Amanhã pede futuro: \u003cb>will be\u003c/b> para todos (I will be, they will be).","sentences":[{"en":"I will be at the factory tomorrow.","pt":"Estarei na fábrica amanhã.","area":"CLP & Automação"},{"en":"Will you be at college tomorrow?","pt":"Você estará na faculdade amanhã?","area":"História"},{"en":"Tomorrow my workout will be longer.","pt":"Amanhã o meu treino será mais longo.","area":"Calistenia"},{"en":"Will the interest rate be the same tomorrow?","pt":"A taxa de juros será a mesma amanhã?","area":"Investimentos"},{"en":"We won't be at home tomorrow.","pt":"Não estaremos em casa amanhã.","area":"Calistenia"}]},{"word":"very","pt":"muito (antes de adjetivo)","tip":"Vem antes do adjetivo: \u003cb>very tired\u003c/b> (nunca \"tired very\"). Com substantivo use \u003ci>a lot of\u003c/i>.","sentences":[{"en":"I am very tired after work.","pt":"Estou muito cansado depois do trabalho.","area":"CLP & Automação"},{"en":"This laser sensor is very small.","pt":"Este sensor a laser é muito pequeno.","area":"CLP & Automação"},{"en":"Pull-ups are very hard for me.","pt":"Barras são muito difíceis para mim.","area":"Calistenia"},{"en":"Is the loan very expensive?","pt":"O financiamento é muito caro?","area":"Investimentos"},{"en":"My automation professor is very good.","pt":"O meu professor de automação é muito bom.","area":"CLP & Automação"}]}],"habits":{"narrateWhen":"Durante o banho, no almoço ou entre as séries de flexão","narrate":["I am at home now. I am tired, but I am happy.","Yesterday I was at the factory. The line was fast.","Tomorrow I will be at college.","My phone is on the table. The water is cold."],"search":{"query":"How does a VL53L0X laser distance sensor work","why":"Pesquise em inglês sobre o sensor do seu TCC e leia só o primeiro parágrafo de um resultado."},"passive":"No ônibus ou no treino, deixe tocar a playlist das 250 frases (aba 3) sem se preocupar em entender tudo."},"phrases":[],"structures":[{"label":"[+] AFIRMATIVA","formula":"[Sujeito] + [am / is / are / was / were / will be] + ..."},{"label":"[-] NEGATIVA","formula":"[Sujeito] + [isn't / aren't / wasn't / weren't / won't be] + ..."},{"label":"[?] PERGUNTA (inversão!)","formula":"[Is / Are / Was / Were / Will] + [Sujeito] + ...?"}],"writing":[{"area":"Automação & CLP — Presente","prompt":"Escreva que o CLP ou o sensor está online/estável usando \u003cb>is / are\u003c/b> e termine com \u003cb>it\u003c/b> ou \u003cb>them\u003c/b> recebendo a ação.","placeholder":"Ex: The sensor is stable now because I calibrated it.","rules":[{"type":"any","words":["is","are","'s","'re"],"msg":"Use o to be no presente: \u003cb>is\u003c/b> (1 coisa) ou \u003cb>are\u003c/b> (várias)."},{"type":"object","words":["it","them"],"msg":"Inclua \u003cb>it\u003c/b> ou \u003cb>them\u003c/b> depois de um verbo (ex.: \u003ci>I calibrated it\u003c/i>)."}],"minLength":10,"sample":"The PLC is online, and I calibrated it.","explanation":"Usamos \u003cb>is\u003c/b> (estado atual para 1 equipamento singular) + \u003cb>it\u003c/b> (pronome objeto para substituir 'The PLC' no final da frase).","hints":["Você precisa de \u003cb>2 elementos\u003c/b> na mesma frase: o verbo To Be no presente (\u003cb>is\u003c/b> ou \u003cb>are\u003c/b>) \u003cu>E\u003c/u> o pronome objeto no final (\u003cb>it\u003c/b> para 1 equipamento ou \u003cb>them\u003c/b> para vários). \u003ci>(Nota: em inglês, CLP se escreve \u003cb>PLC\u003c/b>, mas aceitamos ambos!)\u003c/i>","\u003cb>Molde Guiado:\u003c/b> Mantenha o começo da sua frase e adicione \u003ccode>, and I tested ___\u003c/code> no final.\u003cbr>Exemplo: \u003ccode>The PLC is online, and I tested ___\u003c/code> (complete a lacuna com \u003cb>it\u003c/b> ou \u003cb>them\u003c/b>!).","\u003cb>Falta só 1 palavra!\u003c/b> Digite no campo:\u003cbr>\u003ccode>The PLC is online, and I calibrated ...\u003c/code> (coloque \u003cb>it\u003c/b> no lugar dos pontinhos!).\u003cbr>\u003ci>Se clicar em Validar mais uma vez sem acertar, eu libero a resposta completa para você!\u003c/i>"]},{"area":"Calistenia — Passado","prompt":"Escreva sobre o seu treino de ontem usando \u003cb>was\u003c/b> ou \u003cb>were\u003c/b>.","placeholder":"Ex: Yesterday my workout was intense, and the pull-ups were heavy.","rules":[{"type":"any","words":["was","were","wasn't","weren't"],"msg":"Use o passado do to be: \u003cb>was\u003c/b> (singular) ou \u003cb>were\u003c/b> (plural)."}],"minLength":8,"sample":"Yesterday my calisthenics workout was intense, and the pull-ups were heavy.","explanation":"No passado (Simple Past), usamos \u003cb>was\u003c/b> para singular (\u003ci>my workout was\u003c/i>) ou \u003cb>were\u003c/b> para plural (\u003ci>the pull-ups were\u003c/i>).","hints":["Para falar sobre como foi o seu treino ontem, inclua obrigatoriamente o passado do verbo To Be: \u003cb>was\u003c/b> (singular: \u003ci>the workout was\u003c/i>) ou \u003cb>were\u003c/b> (plural: \u003ci>the pull-ups were\u003c/i>).","\u003cb>Molde Guiado:\u003c/b> Complete o esqueleto abaixo com \u003cb>was\u003c/b>:\u003cbr>\u003ccode>Yesterday my workout ___ intense.\u003c/code>","\u003cb>Falta só 1 palavra!\u003c/b> Digite no campo:\u003cbr>\u003ccode>Yesterday my pull-up workout ... very good.\u003c/code> (coloque \u003cb>was\u003c/b> no lugar dos pontinhos!).\u003cbr>\u003ci>Clique em Validar mais uma vez se quiser ver a resposta completa!\u003c/i>"]},{"area":"Pergunta técnica ou financeira","prompt":"Faça uma pergunta começando com \u003cb>Is, Are, Was, Were\u003c/b> ou \u003cb>Will\u003c/b> e termine com \u003cb>?\u003c/b>","placeholder":"Ex: Is the Selic interest rate high now?","rules":[{"type":"start","words":["is","are","was","were","will","am","isn't","aren't","wasn't","weren't"],"msg":"Comece com o verbo: \u003cb>Is / Are / Was / Were / Will\u003c/b>."},{"type":"end","words":["?"],"msg":"Termine com o ponto de interrogação \u003cb>?\u003c/b>"}],"minLength":8,"sample":"Is the Selic interest rate high now?","explanation":"Em perguntas com o verbo To Be, fazemos a inversão: colocamos \u003cb>Is / Are / Was / Were / Will\u003c/b> no início da frase e fechamos com \u003cb>?\u003c/b>","hints":["Para fazer uma pergunta direta em inglês com To Be, inverta a ordem: \u003cb>comece a frase\u003c/b> com \u003cb>Is, Are, Was, Were\u003c/b> ou \u003cb>Will\u003c/b> e coloque o ponto de interrogação (\u003cb>?\u003c/b>) no final!","\u003cb>Molde Guiado:\u003c/b> Inverta o verbo para a frente:\u003cbr>\u003ccode>___ the PLC online now?\u003c/code> (complete com \u003cb>Is\u003c/b> no começo e não esqueça do \u003cb>?\u003c/b> no final!).","\u003cb>Quase pronto!\u003c/b> Digite exatamente a pergunta abaixo completando a primeira palavra:\u003cbr>\u003ccode>... the Selic interest rate high now?\u003c/code> (coloque \u003cb>Is\u003c/b> no início!).\u003cbr>\u003ci>Clique em Validar mais uma vez se quiser liberar a resposta completa!\u003c/i>"]}],"story":{"title":"From the Paint Shop PLC to the First Real Estate Asset","paragraphs":[{"en":"It is 6:00 AM in the ABC region, and the morning air is cold. Since the 1950s, this region has been the industrial heart of Brazil.","pt":"São 6h00 da manhã na região do ABC, e o ar da manhã está frio. Desde os anos 1950, esta região é o coração industrial do Brasil.","xray":"\u003ci>It is 6:00 AM\u003c/i> (uso obrigatório do sujeito neutro 'It' para horas e clima) + \u003ci>the morning air is cold\u003c/i> (To Be descrevendo estado físico) | ⚠️ \u003ci>Since the 1950s, this region \u003cb>has been\u003c/b>\u003c/i>: com \u003cb>since\u003c/b> o inglês exige o Present Perfect — dizer 'since... is' é erro clássico de brasileiro."},{"en":"At the truck cab paint shop, the automated robots are online. I am responsible for the control panel, so I check the PLC and the distance sensors.","pt":"Na pintura de cabines de caminhão, os robôs automatizados estão online. Eu sou responsável pelo painel de controle, então eu verifico o CLP e os sensores de distância.","xray":"\u003ci>robots are online\u003c/i> (3ª pessoa plural = They are) | \u003ci>I am responsible\u003c/i> (1ª pessoa singular) | Conector lógico \u003ci>so\u003c/i> (então/portanto)."},{"en":"Yesterday, one optical sensor was dirty, and the telemetry data in the SQL table was inaccurate. I cleaned it, and now the closed-loop system is 100% stable.","pt":"Ontem, um sensor óptico estava sujo, e os dados de telemetria na tabela SQL estavam imprecisos. Eu o limpei, e agora o sistema em malha fechada está 100% estável.","xray":"Contraste temporal perfeito: \u003ci>was\u003c/i> (passado singular de To Be) &rarr; \u003ci>I cleaned it\u003c/i> ('it' como pronome objeto recebendo a limpeza) &rarr; \u003ci>now the system is\u003c/i> (presente)."},{"en":"At noon, my coworker talks to me about economics. Before the Real Plan in 1994, Brazilian inflation was out of control, like an open-loop system without feedback.","pt":"Ao meio-dia, meu colega conversa comigo sobre economia. Antes do Plano Real em 1994, a inflação brasileira estava fora de controle, como um sistema em malha aberta sem realimentação (feedback).","xray":"\u003ci>talks to me\u003c/i> (pronome objeto 'me' após a preposição 'to') + Analogia real entre Engenharia de Controle (Malha Aberta vs Malha Fechada) e Banco Central controlando a inflação!"},{"en":"After my shift, it is time for calisthenics. Progressive overload is my main rule: today, weighted pull-ups and parallel bar dips are in my training log.","pt":"Depois do meu turno, é hora da calistenia. A sobrecarga progressiva é minha regra principal: hoje, barras com peso e paralelas estão no meu diário de treino.","xray":"\u003ci>Progressive overload is\u003c/i> (singular = is) vs \u003ci>pull-ups and dips are\u003c/i> (sujeito composto plural = are)."},{"en":"My training partner is at the park. I train with him every Tuesday because mechanical tension and clean form are essential for muscle growth.","pt":"Meu parceiro de treino está no parque. Eu treino com ele toda terça-feira porque tensão mecânica e execução limpa são essenciais para o crescimento muscular.","xray":"\u003ci>with him\u003c/i> (pronome objeto masculino após a preposição 'with' — nunca diga 'with he') + \u003ci>are essential\u003c/i>."},{"en":"At night, I open my financial spreadsheet. My fixed-income bonds (IPCA+) and Real Estate Funds (FIIs) are growing because compound interest works for me every day.","pt":"À noite, eu abro minha planilha financeira. Meus títulos de renda fixa (IPCA+) e Fundos Imobiliários (FIIs) estão crescendo porque os juros compostos trabalham para mim todo dia.","xray":"\u003ci>works for me\u003c/i> (pronome objeto 'me' após preposição 'for') + vocabulário financeiro real: \u003ci>spreadsheet\u003c/i> (planilha), \u003ci>bonds\u003c/i> (títulos), \u003ci>compound interest\u003c/i> (juros compostos)."},{"en":"My goal for next year is clear: I will be ready to buy my first apartment. I will use the SAC amortization table because the total interest will be much lower for us!","pt":"Minha meta para o próximo ano está clara: eu estarei pronto para comprar meu primeiro apartamento. Eu usarei a tabela de amortização SAC porque o juro total será muito menor para nós!","xray":"Projeção no Simple Future: \u003ci>I will be ready\u003c/i> + \u003ci>the total interest will be much lower for us\u003c/i>."}]},"masterclass":[{"title":"Módulo 1 [Automação & Controle]: Open-Loop vs. Closed-Loop (PID)","en":"In industrial automation, an Open-Loop system acts without verifying the output. In contrast, a Closed-Loop system uses a sensor to read the real variable (Process Variable - PV), compares it with the desired target (Setpoint - SP), and calculates the Error (e = SP - PV). The PLC then adjusts the actuator immediately.","pt":"Na automação industrial, um sistema em Malha Aberta atua sem verificar a saída. Em contraste, um sistema em Malha Fechada usa um sensor para ler a variável real (Variável de Processo - PV), compara com o alvo desejado (Setpoint - SP) e calcula o Erro (e = SP - PV). O CLP então ajusta o atuador imediatamente."},{"title":"Módulo 2 [Calistenia & Biomecânica]: Leverage & Mechanical Tension","en":"In bodyweight training, you don't always need extra iron plates to create progressive overload. By changing the lever arm (for example, moving from a tuck front lever to a full front lever, or Archer pull-ups), torque increases at the shoulder joint, generating massive mechanical tension and neural adaptation.","pt":"No treino com peso corporal, você nem sempre precisa de anilhas extras para criar sobrecarga progressiva. Ao alterar o braço de alavanca (por exemplo, passando de um tuck front lever para um front lever completo, ou barras arqueiro), o torque aumenta na articulação do ombro, gerando enorme tensão mecânica e adaptação neural."},{"title":"Módulo 3 [Investimentos]: Real Interest Rate & Dividend Yield","en":"A smart investor never looks only at the nominal return. What builds wealth is the Real Interest Rate (Nominal Rate minus Inflation). When you combine inflation-linked bonds (Tesouro IPCA+) with Real Estate Funds (REITs/FIIs) that pay tax-free monthly dividends, you protect your purchasing power and accelerate the snowball effect.","pt":"Um investidor inteligente nunca olha apenas para o retorno nominal. O que constrói patrimônio é o Juro Real (Taxa Nominal menos a Inflação). Quando você combina títulos atrelados à inflação (Tesouro IPCA+) com Fundos Imobiliários (FIIs) que pagam dividendos mensais isentos de IR, você protege seu poder de compra e acelera o efeito bola de neve."}],"quiz":[{"topic":"Verbo To Be Presente (Singular vs Plural em Automação)","q":"[CLP & Automação] 'The PLC CPU ___ online, and all the safety sensors ___ active now.'","audio":"The PLC CPU is online, and all the safety sensors are active now.","options":["is / are","are / is","is / is","was / are"],"answer":0,"explanation":"\u003cb>Explicação em 3 Ângulos:\u003c/b>\u003cbr>1. \u003cb>Gramática:\u003c/b> 'The PLC CPU' é singular (\u003ci>It\u003c/i> &rarr; \u003cb>is\u003c/b>). 'All the safety sensors' é plural (\u003ci>They\u003c/i> &rarr; \u003cb>are\u003c/b>).\u003cbr>2. \u003cb>Engenharia:\u003c/b> Em um diagnóstico de rede, a CPU é o nó mestre (singular) e os sensores são os escravos de campo (plural)."},{"topic":"Pronomes Objeto (Them vs They)","q":"[Engenharia de Dados] 'The SQL tables are ready because I normalized ___ this morning.'","audio":"The SQL tables are ready because I normalized them this morning.","options":["they","them","it","us"],"answer":1,"explanation":"\u003cb>Posição pós-verbo:\u003c/b> Quem executou a normalização fui eu (\u003ci>I\u003c/i>). As tabelas SQL (plural) \u003cb>receberam\u003c/b> a ação depois do verbo \u003ci>normalized\u003c/i>, logo usamos o pronome objeto plural \u003cb>them\u003c/b>."},{"topic":"Verbo To Be no Passado (Was vs Were)","q":"[História Econômica do Brasil] 'Before the Real Plan in 1994, hyperinflation ___ a huge problem, and interest rates ___ extremely volatile.'","audio":"Before the Real Plan in 1994, hyperinflation was a huge problem, and interest rates were extremely volatile.","options":["were / was","is / are","was / were","was / was"],"answer":2,"explanation":"\u003cb>Passado Histórico (1994):\u003c/b> 'Hyperinflation' é singular (\u003ci>it\u003c/i> &rarr; \u003cb>was\u003c/b>). 'Interest rates' (taxas de juros) está no plural (\u003ci>they\u003c/i> &rarr; \u003cb>were\u003c/b>)."},{"topic":"Verbo To Be no Futuro (Will be)","q":"[Investimentos & Juros Compostos] 'With monthly contributions in IPCA+ bonds and REITs, our portfolio ___ much larger in ten years.'","audio":"With monthly contributions in IPCA plus bonds and REITs, our portfolio will be much larger in ten years.","options":["was","is","will is","will be"],"answer":3,"explanation":"\u003cb>Projeção no Futuro:\u003c/b> Para indicar estado futuro ('in ten years'), usamos \u003cb>will be\u003c/b> para qualquer pessoa (nunca existe 'will is' ou 'will are')."},{"topic":"Estrutura Interrogativa com To Be (Inversão)","q":"[Diagnóstico de Rede Industrial] Como você pergunta corretamente em inglês: 'Os inversores de frequência estavam quentes ontem?'","audio":"Were the frequency inverters hot yesterday?","options":["Were the frequency inverters hot yesterday?","The frequency inverters were hot yesterday?","Was the frequency inverters hot yesterday?","Did the frequency inverters were hot yesterday?"],"answer":0,"explanation":"\u003cb>Inversão do Verbo To Be:\u003c/b> O verbo \u003ci>To Be\u003c/i> nunca usa o auxiliar 'Did'. Para perguntar, basta inverter o verbo para a frente do sujeito. Como 'inverters' é plural no passado, usamos: \u003cb>Were the frequency inverters hot yesterday?\u003c/b>"},{"topic":"Negativa no Passado e Futuro (Wasn't / Won't be)","q":"[Revisão Integrada] 'The database ___ ready yesterday, but I fixed the script and there ___ any errors tomorrow.'","audio":"The database wasn't ready yesterday, but I fixed the script and there won't be any errors tomorrow.","options":["weren't / isn't","wasn't / won't be","isn't / wasn't","not was / will not is"],"answer":1,"explanation":"\u003cb>Domínio dos 3 Tempos na Negativa:\u003c/b> Para 'The database' (singular) ontem (\u003ci>yesterday\u003c/i>), a negativa é \u003cb>wasn't\u003c/b> (was not). Para amanhã (\u003ci>tomorrow\u003c/i>), a negativa do futuro de To Be é \u003cb>won't be\u003c/b> (will not be)."}],"tips":[{"type":"Canal","title":"Rachel's English","why":"Vídeos sobre o som curto /ɪ/ e o longo /iː/ (ship x sheep).","query":"Rachel's English ship sheep"},{"type":"Livro","title":"Essential Grammar in Use (Raymond Murphy)","why":"As primeiras unidades explicam am / is / are com exercícios.","query":"Essential Grammar in Use am is are"},{"type":"Podcast","title":"BBC Learning English — 6 Minute English","why":"Ouça 1 episódio e anote 5 frases com is / are / was / were.","query":"BBC Learning English 6 Minute English"}],"conversation":{"title":"Seu primeiro dia com um supervisor que só fala inglês","script":"Gemini, vamos praticar inglês por voz.\nVocê é meu novo supervisor numa fábrica de caminhões.\nFaça 6 perguntas simples em inglês, uma de cada vez, usando o verbo to be (am, is, are, was, were, will be).\nExemplos: Where are you from? Were you at work yesterday?\nEspere a minha resposta a cada pergunta. Fale devagar e com palavras simples.\nSó no final, liste os meus erros e mostre as frases corretas."},"models":{},"notes":[]}</script>
<script id="default-deck" type="application/json">[{"id":1,"cat":"plc","catName":"Automação, CLP & Dados","pt":"O painel do CLP está online e o sinal está estável agora.","en":"The PLC panel is online and the signal is stable now."},{"id":2,"cat":"plc","catName":"Automação, CLP & Dados","pt":"O ciclo de varredura do CLP lê todas as entradas físicas em dois milissegundos.","en":"The PLC scan cycle reads all physical inputs in two milliseconds."},{"id":3,"cat":"plc","catName":"Automação, CLP & Dados","pt":"Ontem os sensores indutivos estavam fora de calibração na linha de montagem.","en":"Yesterday the inductive sensors were out of calibration on the assembly line."},{"id":4,"cat":"plc","catName":"Automação, CLP & Dados","pt":"Este é um sistema em malha fechada: ele lê o sensor e corrige o erro automaticamente.","en":"This is a closed-loop system: it reads the sensor and corrects the error automatically."},{"id":5,"cat":"plc","catName":"Automação, CLP & Dados","pt":"Os dados de telemetria estão na tabela SQL, e eu os analisei para nós.","en":"The telemetry data is in the SQL table, and I analyzed it for us."},{"id":6,"cat":"plc","catName":"Automação, CLP & Dados","pt":"A latência da rede industrial estava alta ontem à noite, mas hoje está baixa.","en":"The industrial network latency was high last night, but today it is low."},{"id":7,"cat":"plc","catName":"Automação, CLP & Dados","pt":"Amanhã a linha de pintura de cabines estará pronta para o teste de produção.","en":"Tomorrow the cab painting line will be ready for the production test."},{"id":8,"cat":"plc","catName":"Automação, CLP & Dados","pt":"A válvula proporcional controla a vazão de tinta com alta precisão.","en":"The proportional valve controls the paint flow with high precision."},{"id":9,"cat":"plc","catName":"Automação, CLP & Dados","pt":"Quando a pressão do ar cai, o CLP envia um alarme para a IHM imediatamente.","en":"When the air pressure drops, the PLC sends an alarm to the HMI immediately."},{"id":10,"cat":"plc","catName":"Automação, CLP & Dados","pt":"Estes cabos de rede Profinet são blindados contra interferência eletromagnética.","en":"These Profinet network cables are shielded against electromagnetic interference."},{"id":11,"cat":"plc","catName":"Automação, CLP & Dados","pt":"Eu configurei o inversor de frequência para controlar a velocidade do motor trifásico.","en":"I configured the frequency inverter to control the speed of the three-phase motor."},{"id":12,"cat":"plc","catName":"Automação, CLP & Dados","pt":"O sensor a laser mede a distância exata entre o robô e a cabine do caminhão.","en":"The laser sensor measures the exact distance between the robot and the truck cab."},{"id":13,"cat":"plc","catName":"Automação, CLP & Dados","pt":"No controle PID, o termo proporcional reage ao erro atual do sistema.","en":"In PID control, the proportional term reacts to the current error of the system."},{"id":14,"cat":"plc","catName":"Automação, CLP & Dados","pt":"O termo integral elimina o erro em regime permanente na malha de controle.","en":"The integral term eliminates the steady-state error in the control loop."},{"id":15,"cat":"plc","catName":"Automação, CLP & Dados","pt":"O termo derivativo antecipa variações bruscas e evita oscilações no processo.","en":"The derivative term anticipates sudden changes and prevents oscillations in the process."},{"id":16,"cat":"plc","catName":"Automação, CLP & Dados","pt":"Lixo entrando significa lixo saindo: dados limpos são essenciais para qualquer banco de dados.","en":"Garbage in means garbage out: clean data is essential for any database."},{"id":17,"cat":"plc","catName":"Automação, CLP & Dados","pt":"A comunicação serial RS-485 é muito robusta para longas distâncias na fábrica.","en":"RS-485 serial communication is very robust for long distances in the factory."},{"id":18,"cat":"plc","catName":"Automação, CLP & Dados","pt":"O protocolo Modbus TCP/IP conecta o nosso CLP diretamente ao servidor em nuvem.","en":"The Modbus TCP/IP protocol connects our PLC directly to the cloud server."},{"id":19,"cat":"plc","catName":"Automação, CLP & Dados","pt":"O botão de emergência corta a alimentação dos atuadores por segurança.","en":"The emergency stop button cuts the power to the actuators for safety."},{"id":20,"cat":"plc","catName":"Automação, CLP & Dados","pt":"Eu uso lógica Ladder para intertravamentos de segurança e Texto Estruturado para matemática.","en":"I use Ladder logic for safety interlocks and Structured Text for math."},{"id":21,"cat":"plc","catName":"Automação, CLP & Dados","pt":"A célula de carga converte a força mecânica em um sinal elétrico milivolts.","en":"The load cell converts mechanical force into a millivolt electrical signal."},{"id":22,"cat":"plc","catName":"Automação, CLP & Dados","pt":"O conversor analógico-digital transforma o sinal de 4 a 20 miliamperes em um valor inteiro.","en":"The analog-to-digital converter transforms the 4 to 20 milliamp signal into an integer value."},{"id":23,"cat":"plc","catName":"Automação, CLP & Dados","pt":"Se o sinal cair abaixo de 4 miliamperes, o sistema detecta um cabo rompido.","en":"If the signal drops below 4 milliamps, the system detects a broken wire."},{"id":24,"cat":"plc","catName":"Automação, CLP & Dados","pt":"Os contatores principais estavam desgastados, então nós os substituímos durante a parada.","en":"The main contactors were worn out, so we replaced them during the shutdown."},{"id":25,"cat":"plc","catName":"Automação, CLP & Dados","pt":"A temperatura do forno de secagem é monitorada por dez termopares tipo K.","en":"The drying oven temperature is monitored by ten type-K thermocouples."},{"id":26,"cat":"plc","catName":"Automação, CLP & Dados","pt":"Cada sensor possui um endereço único na rede para evitar colisão de pacotes de dados.","en":"Each sensor has a unique address on the network to prevent data packet collisions."},{"id":27,"cat":"plc","catName":"Automação, CLP & Dados","pt":"O painel do supervisório SCADA mostra o consumo de energia em tempo real.","en":"The SCADA supervisory dashboard shows power consumption in real time."},{"id":28,"cat":"plc","catName":"Automação, CLP & Dados","pt":"Nós criamos uma consulta SQL para filtrar apenas as falhas críticas do último turno.","en":"We created an SQL query to filter only the critical faults from the last shift."},{"id":29,"cat":"plc","catName":"Automação, CLP & Dados","pt":"O encoder incremental envia pulsos digitais para medir a rotação do eixo.","en":"The incremental encoder sends digital pulses to measure the shaft rotation."},{"id":30,"cat":"plc","catName":"Automação, CLP & Dados","pt":"Quando a chave fim de curso é acionada, o cilindro pneumático recua.","en":"When the limit switch is triggered, the pneumatic cylinder retracts."},{"id":31,"cat":"plc","catName":"Automação, CLP & Dados","pt":"A manutenção preditiva usa dados de vibração para prever falhas antes que a máquina quebre.","en":"Predictive maintenance uses vibration data to predict failures before the machine breaks."},{"id":32,"cat":"plc","catName":"Automação, CLP & Dados","pt":"O tempo médio entre falhas aumentou porque padronizamos a rotina de calibração.","en":"The mean time between failures increased because we standardized the calibration routine."},{"id":33,"cat":"plc","catName":"Automação, CLP & Dados","pt":"A fonte de alimentação de 24 volts em corrente contínua é o padrão da automação industrial.","en":"The 24-volt DC power supply is the standard in industrial automation."},{"id":34,"cat":"plc","catName":"Automação, CLP & Dados","pt":"O relé de estado sólido chaveia cargas rápidas sem desgaste mecânico nos contatos.","en":"The solid-state relay switches fast loads without mechanical wear on the contacts."},{"id":35,"cat":"plc","catName":"Automação, CLP & Dados","pt":"Eu testei a lógica no simulador antes de descarregar o programa no CLP real.","en":"I tested the logic in the simulator before downloading the program to the real PLC."},{"id":36,"cat":"plc","catName":"Automação, CLP & Dados","pt":"O endereço IP da IHM estava na sub-rede errada, mas eu o corrigi rapidamente.","en":"The HMI IP address was on the wrong subnet, but I fixed it quickly."},{"id":37,"cat":"plc","catName":"Automação, CLP & Dados","pt":"Uma boa documentação elétrica economiza horas durante o diagnóstico de falhas.","en":"Good electrical documentation saves hours during fault troubleshooting."},{"id":38,"cat":"plc","catName":"Automação, CLP & Dados","pt":"O disjuntor motor protege o equipamento contra sobrecarga térmica e curto-circuito.","en":"The motor circuit breaker protects the equipment against thermal overload and short circuit."},{"id":39,"cat":"plc","catName":"Automação, CLP & Dados","pt":"A viscosidade da tinta muda com a temperatura, então o sistema ajusta a pressão automaticamente.","en":"Paint viscosity changes with temperature, so the system adjusts the pressure automatically."},{"id":40,"cat":"plc","catName":"Automação, CLP & Dados","pt":"O robô industrial repete o mesmo movimento com precisão de décimos de milímetro.","en":"The industrial robot repeats the same movement with a precision of tenths of a millimeter."},{"id":41,"cat":"plc","catName":"Automação, CLP & Dados","pt":"Nós armazenamos o histórico de produção em um banco de dados relacional.","en":"We store the production history in a relational database."},{"id":42,"cat":"plc","catName":"Automação, CLP & Dados","pt":"A chave primária garante que cada registro na tabela de dados seja único.","en":"The primary key ensures that each record in the data table is unique."},{"id":43,"cat":"plc","catName":"Automação, CLP & Dados","pt":"Um gráfico de controle estatístico mostra se o processo está dentro dos limites de tolerância.","en":"A statistical control chart shows if the process is within tolerance limits."},{"id":44,"cat":"plc","catName":"Automação, CLP & Dados","pt":"O filtro passa-baixa remove o ruído de alta frequência da leitura do sensor.","en":"The low-pass filter removes high-frequency noise from the sensor reading."},{"id":45,"cat":"plc","catName":"Automação, CLP & Dados","pt":"A histerese evita que o sensor fique ligando e desligando rapidamente no ponto de ajuste.","en":"Hysteresis prevents the sensor from switching on and off rapidly at the setpoint."},{"id":46,"cat":"plc","catName":"Automação, CLP & Dados","pt":"O atuador linear elétrico oferece um controle de posição mais preciso do que o cilindro pneumático.","en":"The electric linear actuator offers more precise position control than the pneumatic cylinder."},{"id":47,"cat":"plc","catName":"Automação, CLP & Dados","pt":"Na indústria 4.0, os sensores inteligentes enviam diagnósticos diretamente para a nuvem.","en":"In Industry 4.0, smart sensors send diagnostics directly to the cloud."},{"id":48,"cat":"plc","catName":"Automação, CLP & Dados","pt":"A válvula solenoide abre quando a saída digital do CLP vai para nível lógico alto.","en":"The solenoid valve opens when the PLC digital output goes to a high logic level."},{"id":49,"cat":"plc","catName":"Automação, CLP & Dados","pt":"Em lógica booleana, uma porta AND só é verdadeira quando todas as entradas são verdadeiras.","en":"In Boolean logic, an AND gate is only true when all inputs are true."},{"id":50,"cat":"plc","catName":"Automação, CLP & Dados","pt":"Uma borda de subida detecta o exato instante em que o botão é pressionado.","en":"A rising edge detects the exact instant when the button is pressed."},{"id":51,"cat":"plc","catName":"Automação, CLP & Dados","pt":"O temporizador com retardo na energização aguarda cinco segundos antes de ligar o exaustor.","en":"The on-delay timer waits five seconds before turning on the exhaust fan."},{"id":52,"cat":"plc","catName":"Automação, CLP & Dados","pt":"O contador incremental soma cada peça aprovada que passa pelo sensor óptico.","en":"The up-counter adds every approved part that passes by the optical sensor."},{"id":53,"cat":"plc","catName":"Automação, CLP & Dados","pt":"A vazão de ar comprimido é monitorada para evitar desperdício de energia na fábrica.","en":"Compressed air flow is monitored to prevent energy waste in the factory."},{"id":54,"cat":"plc","catName":"Automação, CLP & Dados","pt":"O barramento de campo reduz drasticamente a quantidade de fios dentro do painel elétrico.","en":"The fieldbus drastically reduces the amount of wiring inside the electrical panel."},{"id":55,"cat":"plc","catName":"Automação, CLP & Dados","pt":"Eu fiz o backup dos parâmetros do inversor antes de atualizar o firmware.","en":"I backed up the inverter parameters before updating the firmware."},{"id":56,"cat":"plc","catName":"Automação, CLP & Dados","pt":"A malha de aterramento protege os instrumentos sensíveis contra surtos elétricos.","en":"The grounding grid protects sensitive instruments against electrical surges."},{"id":57,"cat":"plc","catName":"Automação, CLP & Dados","pt":"O sistema de visão computacional inspeciona a qualidade da superfície pintada.","en":"The computer vision system inspects the quality of the painted surface."},{"id":58,"cat":"plc","catName":"Automação, CLP & Dados","pt":"Quando a eficiência global do equipamento é alta, o custo por unidade produzida cai.","en":"When Overall Equipment Effectiveness is high, the cost per unit produced drops."},{"id":59,"cat":"plc","catName":"Automação, CLP & Dados","pt":"Os dados brutos do sensor são convertidos em unidades de engenharia como milímetros e bar.","en":"Raw sensor data is converted into engineering units like millimeters and bar."},{"id":60,"cat":"plc","catName":"Automação, CLP & Dados","pt":"A redundância de servidores garante que a linha de produção nunca pare por falha de software.","en":"Server redundancy ensures that the production line never stops due to software failure."},{"id":61,"cat":"plc","catName":"Automação, CLP & Dados","pt":"O protocolo MQTT é leve e ideal para transmitir telemetria de microcontroladores para a nuvem.","en":"The MQTT protocol is lightweight and ideal for transmitting telemetry from microcontrollers to the cloud."},{"id":62,"cat":"plc","catName":"Automação, CLP & Dados","pt":"Eu escrevi um script em Python para limpar os dados ausentes antes de gerar o relatório.","en":"I wrote a Python script to clean missing data before generating the report."},{"id":63,"cat":"plc","catName":"Automação, CLP & Dados","pt":"A calibração periódica garante que a medição do instrumento continue confiável ao longo do tempo.","en":"Periodic calibration ensures that the instrument measurement remains reliable over time."},{"id":64,"cat":"plc","catName":"Automação, CLP & Dados","pt":"O diagrama de tubulação e instrumentação mostra todos os sensores e válvulas do processo.","en":"The piping and instrumentation diagram shows all sensors and valves in the process."},{"id":65,"cat":"plc","catName":"Automação, CLP & Dados","pt":"Dominar automação e dados juntos transforma qualquer técnico em um engenheiro completo.","en":"Mastering automation and data together transforms any technician into a complete engineer."},{"id":66,"cat":"hist","catName":"História & Economia","pt":"Durante a Primeira Revolução Industrial, a máquina a vapor mudou a história da produção humana.","en":"During the First Industrial Revolution, the steam engine changed the history of human production."},{"id":67,"cat":"hist","catName":"História & Economia","pt":"Em 1788, James Watt adaptou o regulador centrífugo à máquina a vapor, um clássico sistema de controle em malha fechada.","en":"In 1788, James Watt adapted the centrifugal governor to the steam engine, a classic closed-loop control system."},{"id":68,"cat":"hist","catName":"História & Economia","pt":"A Segunda Revolução Industrial introduziu a eletricidade, o aço e a linha de montagem em massa.","en":"The Second Industrial Revolution introduced electricity, steel, and the mass assembly line."},{"id":69,"cat":"hist","catName":"História & Economia","pt":"Henry Ford reduziu o tempo de montagem de um carro de doze horas para noventa minutos.","en":"Henry Ford reduced the assembly time of a car from twelve hours to ninety minutes."},{"id":70,"cat":"hist","catName":"História & Economia","pt":"Na década de 1950, a região do ABC Paulista se tornou o berço da indústria automotiva brasileira.","en":"In the 1950s, the ABC Paulista region became the cradle of the Brazilian automotive industry."},{"id":71,"cat":"hist","catName":"História & Economia","pt":"A chegada das montadoras a São Bernardo e Santo André atraiu milhares de trabalhadores e engenheiros.","en":"The arrival of automakers in Sao Bernardo and Santo Andre attracted thousands of workers and engineers."},{"id":72,"cat":"hist","catName":"História & Economia","pt":"Em 1968, os engenheiros criaram o primeiro Controlador Lógico Programável para substituir painéis de relés.","en":"In 1968, engineers created the first Programmable Logic Controller to replace relay panels."},{"id":73,"cat":"hist","catName":"História & Economia","pt":"Antes do CLP, mudar a lógica de uma linha automotiva exigia refazer milhares de fios manualmente.","en":"Before the PLC, changing the logic of an automotive line required rewiring thousands of cables manually."},{"id":74,"cat":"hist","catName":"História & Economia","pt":"A Terceira Revolução Industrial trouxe os semicondutores, os computadores e a automação eletrônica.","en":"The Third Industrial Revolution brought semiconductors, computers, and electronic automation."},{"id":75,"cat":"hist","catName":"História & Economia","pt":"Antes do Plano Real em 1994, a hiperinflação era um pesadelo diário para as famílias brasileiras.","en":"Before the Real Plan in 1994, hyperinflation was a daily nightmare for Brazilian families."},{"id":76,"cat":"hist","catName":"História & Economia","pt":"Na década de 1980, os preços nos supermercados brasileiros mudavam da manhã para a noite.","en":"In the 1980s, prices in Brazilian supermarkets changed from morning to night."},{"id":77,"cat":"hist","catName":"História & Economia","pt":"A criação da URV em 1994 foi uma solução brilhante para quebrar a inflação inercial no Brasil.","en":"The creation of the URV in 1994 was a brilliant solution to break inertial inflation in Brazil."},{"id":78,"cat":"hist","catName":"História & Economia","pt":"Quando a moeda é estável, os engenheiros e empresários conseguem planejar investimentos de longo prazo.","en":"When the currency is stable, engineers and entrepreneurs can plan long-term investments."},{"id":79,"cat":"hist","catName":"História & Economia","pt":"O ciclo do café no século XIX financiou as primeiras ferrovias e a infraestrutura do estado de São Paulo.","en":"The coffee cycle in the 19th century financed the first railroads and infrastructure in Sao Paulo state."},{"id":80,"cat":"hist","catName":"História & Economia","pt":"A Companhia Siderúrgica Nacional em Volta Redonda foi um marco para a produção de aço laminado no Brasil.","en":"The National Steel Company in Volta Redonda was a milestone for rolled steel production in Brazil."},{"id":81,"cat":"hist","catName":"História & Economia","pt":"A laminação de metais é um dos processos mecânicos mais importantes da civilização moderna.","en":"Metal rolling is one of the most important mechanical processes in modern civilization."},{"id":82,"cat":"hist","catName":"História & Economia","pt":"Após a Segunda Guerra Mundial, o sistema de Bretton Woods reorganizou o comércio e as finanças globais.","en":"After World War II, the Bretton Woods system reorganized global trade and finance."},{"id":83,"cat":"hist","catName":"História & Economia","pt":"O milagre japonês do pós-guerra foi construído sobre controle estatístico de qualidade e melhoria contínua.","en":"The post-war Japanese miracle was built on statistical quality control and continuous improvement."},{"id":84,"cat":"hist","catName":"História & Economia","pt":"O método Kaizen ensina que pequenas melhorias diárias geram resultados gigantescos no longo prazo.","en":"The Kaizen method teaches that small daily improvements generate massive results in the long term."},{"id":85,"cat":"hist","catName":"História & Economia","pt":"O Sistema Toyota de Produção revolucionou a manufatura ao eliminar estoques desnecessários e desperdícios.","en":"The Toyota Production System revolutionized manufacturing by eliminating unnecessary inventory and waste."},{"id":86,"cat":"hist","catName":"História & Economia","pt":"A invenção do transistor em 1947 nos Laboratórios Bell abriu caminho para todos os processadores modernos.","en":"The invention of the transistor in 1947 at Bell Labs paved the way for all modern processors."},{"id":87,"cat":"hist","catName":"História & Economia","pt":"A Lei de Moore previu que o poder de processamento dobraria aproximadamente a cada dois anos.","en":"Moore's Law predicted that processing power would double approximately every two years."},{"id":88,"cat":"hist","catName":"História & Economia","pt":"Na década de 1970, o modelo relacional da IBM deu origem à linguagem SQL que usamos hoje.","en":"In the 1970s, IBM's relational model gave birth to the SQL language we use today."},{"id":89,"cat":"hist","catName":"História & Economia","pt":"As crises do petróleo nos anos 1970 forçaram a indústria mundial a criar motores mais eficientes.","en":"The oil crises in the 1970s forced global industry to create more efficient engines."},{"id":90,"cat":"hist","catName":"História & Economia","pt":"A Quarta Revolução Industrial integra inteligência artificial, nuvem e máquinas conectadas.","en":"The Fourth Industrial Revolution integrates artificial intelligence, cloud, and connected machines."},{"id":91,"cat":"hist","catName":"História & Economia","pt":"A história mostra que países que investem em educação técnica e engenharia crescem com mais solidez.","en":"History shows that countries that invest in technical education and engineering grow more solidly."},{"id":92,"cat":"hist","catName":"História & Economia","pt":"No Brasil Império, o Barão de Mauá foi um pioneiro na construção de ferrovias, estaleiros e iluminação.","en":"In Imperial Brazil, Baron of Maua was a pioneer in building railroads, shipyards, and lighting."},{"id":93,"cat":"hist","catName":"História & Economia","pt":"A abertura comercial dos anos 1990 obrigou as fábricas brasileiras a modernizarem sua automação.","en":"The trade opening of the 1990s forced Brazilian factories to modernize their automation."},{"id":94,"cat":"hist","catName":"História & Economia","pt":"A crise financeira de 2008 começou no mercado de hipotecas dos Estados Unidos e afetou o mundo inteiro.","en":"The 2008 financial crisis started in the United States mortgage market and affected the entire world."},{"id":95,"cat":"hist","catName":"História & Economia","pt":"Estudar as crises do passado protege você de cometer os mesmos erros financeiros no futuro.","en":"Studying past crises protects you from making the same financial mistakes in the future."},{"id":96,"cat":"hist","catName":"História & Economia","pt":"A imprensa de Gutenberg no século XV democratizou o conhecimento assim como a internet fez no século XX.","en":"Gutenberg's printing press in the 15th century democratized knowledge just as the internet did in the 20th century."},{"id":97,"cat":"hist","catName":"História & Economia","pt":"As antigas corporações de ofício exigiam anos de prática antes que o aprendiz se tornasse um mestre.","en":"Ancient craft guilds required years of practice before an apprentice became a master."},{"id":98,"cat":"hist","catName":"História & Economia","pt":"Na Grécia Antiga, os atletas já usavam exercícios com o próprio peso corporal nas palestras e ginásios.","en":"In Ancient Greece, athletes already used bodyweight exercises in palaestras and gymnasiums."},{"id":99,"cat":"hist","catName":"História & Economia","pt":"A palavra calistenia vem do grego Kallos, que significa beleza, e Sthenos, que significa força.","en":"The word calisthenics comes from the Greek Kallos, meaning beauty, and Sthenos, meaning strength."},{"id":100,"cat":"hist","catName":"História & Economia","pt":"Arquimedes descobriu a matemática das alavancas que hoje explica tanto máquinas quanto a biomecânica humana.","en":"Archimedes discovered the mathematics of levers that today explains both machines and human biomechanics."},{"id":101,"cat":"hist","catName":"História & Economia","pt":"Isaac Newton formulou as leis do movimento que governam desde um motor elétrico até uma barra fixa.","en":"Isaac Newton formulated the laws of motion that govern everything from an electric motor to a pull-up bar."},{"id":102,"cat":"hist","catName":"História & Economia","pt":"James Clerk Maxwell unificou a eletricidade e o magnetismo, permitindo a criação dos motores de indução.","en":"James Clerk Maxwell unified electricity and magnetism, enabling the creation of induction motors."},{"id":103,"cat":"hist","catName":"História & Economia","pt":"Nikola Tesla desenvolveu o motor de corrente alternada que move quase todas as fábricas do planeta.","en":"Nikola Tesla developed the alternating current motor that powers almost every factory on the planet."},{"id":104,"cat":"hist","catName":"História & Economia","pt":"Claude Shannon criou a teoria da informação e mostrou como circuitos elétricos executam álgebra booleana.","en":"Claude Shannon created information theory and showed how electrical circuits execute Boolean algebra."},{"id":105,"cat":"hist","catName":"História & Economia","pt":"A corrida espacial nos anos 1960 acelerou a miniaturização dos computadores e sistemas de telemetria.","en":"The space race in the 1960s accelerated the miniaturization of computers and telemetry systems."},{"id":106,"cat":"hist","catName":"História & Economia","pt":"O computador de orientação da Apollo 11 tinha menos memória do que um microcontrolador moderno de vinte reais.","en":"The Apollo 11 guidance computer had less memory than a modern twenty-real microcontroller."},{"id":107,"cat":"hist","catName":"História & Economia","pt":"A criação do protocolo TCP/IP permitiu que redes industriais e computadores domésticos falassem a mesma língua.","en":"The creation of the TCP/IP protocol allowed industrial networks and home computers to speak the same language."},{"id":108,"cat":"hist","catName":"História & Economia","pt":"No século XX, o inglês se consolidou como o idioma universal da engenharia, da ciência e das finanças.","en":"In the 20th century, English consolidated itself as the universal language of engineering, science, and finance."},{"id":109,"cat":"hist","catName":"História & Economia","pt":"Ler manuais técnicos originais em inglês dá a você acesso direto ao conhecimento na fonte.","en":"Reading original technical manuals in English gives you direct access to knowledge at the source."},{"id":110,"cat":"hist","catName":"História & Economia","pt":"A urbanização acelerada de São Paulo no século XX valorizou intensamente os terrenos bem localizados.","en":"The rapid urbanization of Sao Paulo in the 20th century intensely increased the value of well-located land."},{"id":111,"cat":"hist","catName":"História & Economia","pt":"Quem comprou imóveis próximos às novas linhas de transporte viu seu patrimônio multiplicar em décadas.","en":"Those who bought real estate near new transit lines saw their wealth multiply over decades."},{"id":112,"cat":"hist","catName":"História & Economia","pt":"A Lei do Inquilinato e a alienação fiduciária trouxeram mais segurança jurídica ao mercado imobiliário brasileiro.","en":"The Tenancy Law and fiduciary alienation brought greater legal security to the Brazilian real estate market."},{"id":113,"cat":"hist","catName":"História & Economia","pt":"Os primeiros Fundos Imobiliários surgiram no Brasil nos anos 1990 e se popularizaram na última década.","en":"The first Real Estate Funds emerged in Brazil in the 1990s and became popular in the last decade."},{"id":114,"cat":"hist","catName":"História & Economia","pt":"O Tesouro Direto, criado em 2002, permit     const db = () => dbp || (dbp = new Promise((res, rej) => {
        try {
            if (!window.indexedDB) throw new Error('sem IndexedDB');
            const r = indexedDB.open('english-flow-lab', 1);
            r.onupgradeneeded = () => r.result.createObjectStore('kv');
            r.onsuccess = () => res(r.result);
            r.onerror = () => rej(r.error);
        } catch (e) { rej(e); }
    }));
    const tx = (mode, fn) => db().then(d => new Promise((res, rej) => {
        const t = d.transaction('kv', mode); const s = t.objectStore('kv'); let out;
        const q = fn(s); if (q) q.onsuccess = () => { out = q.result; };
        t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    }));
    return {
        async get(k) { try { const v = await tx('readonly', s => s.get(k)); return v === undefined ? null : v; } catch (e) { return store.getJson('kv_' + k, null); } },
        async set(k, v) { try { await tx('readwrite', s => s.put(v, k)); } catch (e) { store.setJson('kv_' + k, v); } },
        async del(k) { try { await tx('readwrite', s => s.delete(k)); } catch (e) { store.del('kv_' + k); } }
    };
})();

function run(fn, ...args) {

        return new Promise((resolve, reject) => google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args));

    return fetch(API.url, { method: 'POST', body: JSON.stringify({ fn, args, k: API.k }), redirect: 'follow', signal: ctrl ? ctrl.signal : undefined })
        .then(r => r.text())
        .then(t => {

}

/** Busca o áudio de vários textos de uma vez no servidor (cache em memória + Drive). */
async function fetchTtsMany(items) {
    initAudioContext();
    const out = new Array(items.length).fill(null);
    const need = [];
    items.forEach((it, i) => {
        const key = it.lang + ':' + it.text;
        if (audioCache.has(key)) { const b = audioCache.get(key); audioCache.delete(key); audioCache.set(key, b); out[i] = b; }
        else if (pendingTts.has(key)) need.push({ i, key, wait: pendingTts.get(key) });
        else need.push({ i, key, it });
    });
    const fresh = need.filter(n => n.it);
    for (let s = 0; s < fresh.length; s += 6) {
        const chunk = fresh.slice(s, s + 6);
        const job = run('ttsBatch', chunk.map(c => ({ text: c.it.text, lang: c.it.lang }))).then(async res => {
            for (let k = 0; k < chunk.length; k++) {
                const r = res && res[k];
                if (!r || !r.ok || !r.b64) continue;
                try {
                    const buf = await decodeB64Audio(r.b64);
                    lastVoiceSrc = r.src || lastVoiceSrc;
                    cacheSetLimited(audioCache, chunk[k].key, buf, AUDIO_CACHE_MAX);
                } catch (e) {}
            }
        }).catch(() => {});
        chunk.forEach(c => pendingTts.set(c.key, job.then(() => audioCache.get(c.key) || null)));
        job.finally(() => chunk.forEach(c => pendingTts.delete(c.key)));
    }
    for (const n of need) {
        const p = n.wait || pendingTts.get(n.key);
        out[n.i] = p ? await p : (audioCache.get(n.key) || null);
    }
    return out;
}
async function fetchTts(text, lang) { return (await fetchTtsMany([{ text, lang }]))[0]; }

let deviceVoices = [];
function loadVoices() { try { deviceVoices = window.speechSynthesis ? speechSynthesis.getVoices() : []; } catch (e) { deviceVoices = []; } }

const BAD_VOICES = new Set();
function bestVoice(lang) {
    const L = lang.toLowerCase();
    const norm = v => String(v.lang || '').toLowerCase().replace('_', '-');
    let list = deviceVoices.filter(v => v.lang && norm(v).startsWith(L.slice(0, 2)) && !BAD_VOICES.has(v.name));
    // sem internet: só vozes instaladas no aparelho (as "online" do Edge/Chrome do PC falham offline)
    if (isOffline()) { const loc = list.filter(v => v.localService); if (loc.length) list = loc; }

}

    let rest = String(text).trim(); const parts = [];

        for (const sep of ['. ', '! ', '? ', '; ', ': ', ', ', ' ']) { const i = rest.lastIndexOf(sep, max - sep.length); if (i > max * 0.4) { cut = i + sep.length; break; } }

function splitSentences(text) {
    const t = String(text || '').replace(/\s+/g, ' ').trim();
    if (!t) return [];
    const raw = []; let start = 0;
    for (let i = 0; i < t.length; i++) {
        const c = t[i];
        if ((c === '.' || c === '!' || c === '?') && (i + 1 === t.length || t[i + 1] === ' ')) {
            const word = t.slice(start, i).split(' ').pop();
            if (c === '.' && /^(mr|mrs|ms|dr|prof|sr|jr|vs|etc|e\.g|i\.e|u\.s|no|st)$/i.test(word)) continue;
            raw.push(t.slice(start, i + 1).trim()); start = i + 1;
        }
    }
    if (t.slice(start).trim()) raw.push(t.slice(start).trim());

    raw.forEach(s => {
        if (s.length > 160) { splitText(s, 160).forEach(x => out.push(x)); return; }

        else out.push(s);
    });

    } else {
        fb.className = 'text-xs font-mono p-3.5 rounded-xl bg-emerald-950/50 text-emerald-200 border-2 border-duo-green/60 space-y-2.5';
        fb.innerHTML = `<div class="font-extrabold text-duo-green text-sm">🔓 Resposta modelo para você aprender:</div>
            <div class="p-2.5 rounded-lg bg-[#0B0F17] border border-tech-border text-white font-bold text-sm">"${esc(w.sample)}"</div>
            <div class="text-slate-300">${rich(w.explanation)}</div>
            <div class="flex flex-wrap gap-2"><button type="button" data-usesample="${i}" class="duo-btn bg-duo-green hover:bg-duo-greenDark border-duo-greenDark text-slate-950 font-extrabold px-3.5 py-2 rounded-xl text-xs">✨ Usar esta resposta (+20 XP)</button>${sayBtn(w.sample, { label: '<i class="fa-solid fa-volume-high"></i> Ouvir' })}</div>`;

let quizQueue = [], currentQ = null, firstAttemptMap = {}, correctFirstTry = 0, masteredTopics = [], reinforceTopics = [];

function selectAnswer(idx) {

function accuracy() { const n = Object.keys(firstAttemptMap).length; return n ? Math.round(correctFirstTry / n * 100) : 0; }

const REPORT_QUEUE = 'efl_report_queue';
function buildReport() {

    return {
        day: LESSON.day, topic: LESSON.topic, curriculumIndex: LESSON.curriculumIndex || 0, cycle: LESSON.cycle || 1,
        lessonId: lessonKey(LESSON), lessonFileId: LESSON._id || '', completed: quizIndexes().length > 0 && quizQueue.length === 0, review: REVIEW_MODE,
        accuracy: accuracy(), correctFirstTry, total: quizIndexes().length, xp, sound: soundResult,

        pairsToday: readDayCounter('efl_pairs_'), speakOkToday: readDayCounter('efl_speak_ok_'),

}
function pendingReports() {
    const q = store.getJson(REPORT_QUEUE, []);
    const old = store.getJson('efl_pending_report', null); // formato antigo (v6)
    if (old) { old.qid = old.qid || 'old'; q.unshift(old); store.del('efl_pending_report'); store.setJson(REPORT_QUEUE, q); }

}
function queueReport(rep) {
    const q = pendingReports().filter(x => !(x.lessonId === rep.lessonId && !!x.review === !!rep.review));
    q.push(rep);

}
function markLessonDone(rep) {
    if (!rep || !rep.completed || !rep.lessonFileId || !BOOT || !Array.isArray(BOOT.lessons)) return;
    const e = BOOT.lessons.find(x => x.id === rep.lessonFileId);
    if (e) { e.done = true; e.acc = Math.max(e.acc || 0, rep.accuracy || 0); kv.set('boot', BOOT); }
}
/** Manda os relatórios guardados, na ordem. Se um falhar, os outros esperam. */
async function flushPendingReports() {
    let last = null;
    for (let guard = 0; guard < 15; guard++) {
        const q = pendingReports();
        if (!q.length) break;
        const rep = q[0];
        last = await run('saveReport', rep);
        store.setJson(REPORT_QUEUE, pendingReports().filter(x => x.qid !== rep.qid));
        markLessonDone(rep);
        if (last && BOOT && BOOT.state && typeof last.streak === 'number') BOOT.state.streak = last.streak;
    }

}
function setSyncStatus(msg, cls) { const el = document.getElementById('sync-status'); if (el) { el.className = 'text-xs font-mono font-bold ' + (cls || 'text-slate-300'); el.innerHTML = msg; } }

    const rep = buildReport();

    rep.madeAt = Date.now();
    queueReport(rep);
    updateNetDot();
    if (!hasServer()) {
        setSyncStatus('⚠️ App ainda não ligado ao servidor: o relatório ficou guardado no aparelho. Abra o link do documento COMECE AQUI.', 'text-duo-amber');
        if (auto) toast('📝 Relatório guardado no aparelho.', 3500);
        return;
    }
    if (isOffline()) {
        setSyncStatus('📴 Sem internet: o relatório ficou guardado no aparelho e vai sozinho quando a internet voltar.', 'text-duo-amber');
        if (auto) toast('📴 Relatório guardado. Vai sozinho quando a internet voltar.', 4200);
        return;
    }
    setSyncStatus('⏳ Salvando no seu Google Drive…', 'text-duo-blue');
    try {
        const r = await flushPendingReports();
        updateHud();
        setSyncStatus(r ? r.message : '✅ Salvo.', 'text-duo-green');

    } catch (e) {
        setSyncStatus('❌ Não consegui salvar agora (' + esc(e.message || e) + '). Ficou guardado e vai sozinho depois.', 'text-duo-red');
    }

}

function flowSteps(tab) { return tab === 'tab2' ? readingSteps() : lessonSteps(); }
function renderFlow(tab) {
    const el = document.getElementById(tab);
    if (!el) return;
    const steps = flowSteps(tab);
    let i = Math.max(0, Math.min(FLOWPOS[tab] || 0, steps.length - 1));
    FLOWPOS[tab] = i;
    const st = steps[i];
    const pct = Math.round(((i + 1) / steps.length) * 100);
    const nextLabel = typeof st.next === 'function' ? st.next() : (st.next || 'Continuar ▶');
    const last = i === steps.length - 1;
    el.innerHTML = `
        <div class="space-y-2">
            <div class="flex items-center justify-between text-[11px] font-mono font-bold"><span class="text-duo-green uppercase tracking-wider">${esc(st.section || '')}</span><span class="text-slate-400">${i + 1} / ${steps.length}</span></div>
            <div class="w-full h-2.5 bg-[#0B0F17] rounded-full overflow-hidden border border-tech-border"><div class="h-full bg-gradient-to-r from-duo-green to-emerald-400 rounded-full transition-all duration-300" style="width:${pct}%"></div></div>
        </div>
        <div class="glass-card rounded-2xl p-5 sm:p-6 space-y-4" data-step="${esc(st.key)}">${st.html()}</div>
        <div class="flex gap-3">
            ${i > 0 ? `<button type="button" data-flow="prev" data-ftab="${tab}" class="duo-btn bg-tech-card hover:bg-slate-800 border-tech-border text-slate-200 font-bold px-5 py-3.5 rounded-xl text-sm">◀</button>` : ''}
            <button type="button" id="flow-next-${tab}" data-flow="next" data-ftab="${tab}" class="flex-1 duo-btn bg-duo-green hover:bg-duo-greenDark border-duo-greenDark text-slate-950 font-extrabold px-5 py-3.5 rounded-xl text-sm disabled:opacity-40">${esc(nextLabel)}</button>
        </div>`;
    if (st.after) st.after();
    updateFlowNav(tab);
}
function updateFlowNav(tab) {
    const steps = flowSteps(tab), st = steps[FLOWPOS[tab] || 0];
    const b = document.getElementById('flow-next-' + tab);
    if (b && st) b.disabled = !!(st.gate && !st.gate());
}
function flowGo(tab, delta) {
    const steps = flowSteps(tab);
    const i = FLOWPOS[tab] || 0;
    if (delta > 0 && i === steps.length - 1) {       // última tela: segue para a próxima aba
        switchTab(tab === 'tab1' ? 'tab2' : 'tab3');
        return;
    }
    if (delta > 0 && steps[i].gate && !steps[i].gate()) return;
    if (!playlistRunning) stopAudioAll();
    FLOWPOS[tab] = Math.max(0, Math.min(i + delta, steps.length - 1));
    saveSession();
    renderFlow(tab);
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
function currentStepKey(tab) { const s = flowSteps(tab)[FLOWPOS[tab] || 0]; return s ? s.key : ''; }
/** Atualiza as telas que mostram contadores (resumo final / dicas). */
function refreshPlan() {
    if (currentTab === 'tab1' && currentStepKey('tab1') === 'done') renderFlow('tab1');
    if (currentTab === 'tab5') renderTab5();
}
function renderTab1() { renderFlow('tab1'); }
function renderTab2() { renderFlow('tab2'); }

/** Nota do som do dia: compara palavra por palavra o que o Chrome entendeu. */
function recordSound(target, said) {
    const tw = [...new Set(normWords(target))], sw = new Set(normWords(said));
    const hit = tw.filter(w => sw.has(w)), miss = tw.filter(w => !sw.has(w));
    const score = Math.round(hit.length / Math.max(1, tw.length) * 100);
    const name = (lessonPillar(2) || {}).title || LESSON.sound || 'som do dia';
    const prevMiss = soundResult ? soundResult.missed : [];
    soundResult = { name, score: Math.max(score, soundResult ? soundResult.score : 0), missed: [...new Set(prevMiss.concat(miss))].filter(w => !hit.includes(w)).slice(0, 12) };
    saveSession();
    return { hit, miss, score };
}

            setTimeout(precacheRecent, 2500);

            <div class="p-3 rounded-xl bg-[#0B0F17] border border-tech-border"><div class="text-2xl font-extrabold text-duo-amber">${rep.speakOkToday}</div><div class="text-[11px] text-slate-400 font-mono">FALAS CERTAS 🎙️</div></div>
