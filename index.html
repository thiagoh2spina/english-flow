        <p class="text-[11px] font-mono text-slate-400">Hábitos marcados: ${['active', 'passive', 'narrate', 'search', 'live'].filter(k => habitChecks[k]).length}/5 • pares ouvidos hoje: ${rep.pairsToday} • foco: ${outputFocus === 'speaking' ? 'Speaking' : 'Writing'}</p>
        <div class="flex flex-wrap items-center gap-3"><button type="button" id="send-report" class="duo-btn bg-duo-green hover:bg-duo-greenDark border-duo-greenDark text-slate-950 font-extrabold px-5 py-2.5 rounded-xl text-xs sm:text-sm"><i class="fa-solid fa-bolt"></i> Enviar relatório agora</button><span id="sync-status" class="text-xs font-mono font-bold text-slate-400">O relatório vai sozinho quando você termina o treino (sem internet, ele espera a conexão).</span></div>
    </div>
    <div class="glass-card rounded-2xl p-5 sm:p-6 space-y-3 border-2 border-duo-purple/40">
        <span class="text-xs font-mono font-bold text-duo-purple uppercase tracking-wider">250 frases (aba 3)</span>
        <label class="flex items-center gap-2 text-sm text-white"><input type="checkbox" id="deck-unlock" ${S.deckLock === 'unlock' ? 'checked' : ''} ${dis} class="w-4 h-4"> Atualizar as frases na próxima lição (senão ficam travadas, como você pediu)</label>
        <textarea id="deck-notes" rows="3" ${dis} placeholder="O que mudar? Ex: troque as de História por frases de reunião técnica na fábrica." class="w-full bg-tech-card border border-tech-border focus:border-duo-purple rounded-xl p-3 text-xs sm:text-sm text-white font-mono outline-none">${esc(S.deckNotes || '')}</textarea>
        <p class="text-[11px] text-slate-400">Cada versão antiga fica guardada na pasta <b>English Flow Lab / Deck</b> do seu Drive.</p>
    </div>
    <div class="glass-card rounded-2xl p-5 sm:p-6 space-y-3">
        <span class="text-xs font-mono font-bold text-duo-blue uppercase tracking-wider">Versões (lições anteriores)</span>
        <div class="space-y-2 max-h-96 overflow-y-auto">${renderVersionsList(120)}</div>
        <p class="text-[11px] text-slate-500">Também no menu ⋮ do topo. Todas ficam na pasta Licoes do seu Drive.</p>
    </div>
    <details id="cfg-details" class="glass-card rounded-2xl p-5 sm:p-6" ${(!linked || !S.hasGeminiKey || cfgOpen) ? 'open' : ''}>
        <summary class="text-sm font-extrabold text-white">⚙️ Configuração (uma vez só) ${linked && S.hasGeminiKey ? '<span class="text-duo-green font-mono text-xs">• pronta</span>' : '<span class="text-duo-amber font-mono text-xs">• falta configurar</span>'}</summary>
        <div class="space-y-3 mt-4 text-xs sm:text-sm">
            <div class="p-3 rounded-xl bg-[#0B0F17] border border-tech-border space-y-2">
                <p class="font-mono font-bold text-slate-300">1. Ligação com o servidor ${linked ? '✅' : '❌'}</p>
                <p class="text-[11px] text-slate-400">O jeito fácil: no Google Drive, abra o documento <b>COMECE AQUI — English Flow Lab</b> e toque no link. Ou cole aqui:</p>
                <input type="url" id="cfg-api" placeholder="Link do servidor (termina em /exec)" value="${esc(API.url)}" class="w-full bg-tech-card border border-tech-border rounded-xl px-3 py-2 text-white font-mono outline-none">
                <input type="password" id="cfg-k" placeholder="${API.k ? '•••••• (já salvo — cole outro só para trocar)' : 'Código secreto'}" class="w-full bg-tech-card border border-tech-border rounded-xl px-3 py-2 text-white font-mono outline-none">
                <button type="button" id="cfg-link-save" class="duo-btn bg-duo-blue hover:bg-duo-blueDark border-duo-blueDark text-white font-bold px-4 py-2 rounded-xl">Ligar</button>
            </div>
            <label class="block"><span class="font-mono font-bold text-slate-300">2. Chave da API do Gemini ${S.hasGeminiKey ? '✅' : '❌'}</span>
                <input type="password" id="cfg-gemini" ${dis} placeholder="${S.hasGeminiKey ? '•••••• (já salva — cole outra só para trocar)' : 'Cole aqui a chave (começa com AIza…)'}" class="mt-1 w-full bg-tech-card border border-tech-border rounded-xl px-3 py-2 text-white font-mono outline-none"></label>
            <label class="block"><span class="font-mono font-bold text-slate-300">3. (Opcional) Chave da voz Google ${S.hasTtsKey ? '✅' : '—'}</span>
                <input type="password" id="cfg-tts" ${dis} placeholder="Só se quiser trocar a voz do aparelho pela voz Google (Cloud Text-to-Speech)" class="mt-1 w-full bg-tech-card border border-tech-border rounded-xl px-3 py-2 text-white font-mono outline-none"></label>
            <div class="grid grid-cols-1 sm:grid-cols-4 gap-3">
                <label class="block"><span class="font-mono font-bold text-slate-300">Raciocínio da IA</span>
                    <select id="cfg-thinking" ${dis} class="mt-1 w-full bg-tech-card border border-tech-border rounded-xl px-3 py-2 text-white outline-none">
                        <option value="high">Alto (melhor; se travar desce sozinho)</option><option value="medium">Médio</option><option value="low">Baixo (mais rápido)</option></select></label>
                <label class="block"><span class="font-mono font-bold text-slate-300">Modelo da lição</span>
                    <select id="cfg-model" ${dis} class="mt-1 w-full bg-tech-card border border-tech-border rounded-xl px-3 py-2 text-white outline-none">
                        <option value="gemini-4-hydrogen">Gemini 4 Hydrogen (grátis)</option><option value="gemini-4-neon">Gemini 4 Neon (só com cobrança ativada)</option><option value="gemini-3.8-flash">Gemini 3.8 Flash (grátis, mais simples)</option></select></label>
                <label class="block"><span class="font-mono font-bold text-slate-300">Voz Google em inglês</span>
                    <select id="cfg-voice-en" ${dis} class="mt-1 w-full bg-tech-card border border-tech-border rounded-xl px-3 py-2 text-white outline-none">
                        <option value="en-US-Chirp3-HD-Charon">Charon (masculina)</option><option value="en-US-Chirp3-HD-Achird">Achird (masculina)</option><option value="en-US-Chirp3-HD-Aoede">Aoede (feminina)</option><option value="en-US-Chirp3-HD-Sulafat">Sulafat (feminina)</option></select></label>
                <label class="block"><span class="font-mono font-bold text-slate-300">Voz Google em português</span>
                    <select id="cfg-voice-pt" ${dis} class="mt-1 w-full bg-tech-card border border-tech-border rounded-xl px-3 py-2 text-white outline-none">
                        <option value="pt-BR-Chirp3-HD-Achernar">Achernar (feminina)</option><option value="pt-BR-Chirp3-HD-Aoede">Aoede (feminina)</option><option value="pt-BR-Chirp3-HD-Achird">Achird (masculina)</option><option value="pt-BR-Chirp3-HD-Schedar">Schedar (masculina)</option></select></label>
            </div>
            <div class="flex flex-wrap gap-2 pt-1">
                <button type="button" id="cfg-save" ${dis} class="duo-btn bg-duo-green hover:bg-duo-greenDark border-duo-greenDark text-slate-950 font-extrabold px-4 py-2 rounded-xl">Salvar</button>
                <button type="button" id="cfg-test" ${dis} class="duo-btn bg-duo-blue hover:bg-duo-blueDark border-duo-blueDark text-white font-bold px-4 py-2 rounded-xl">Testar tudo</button>
                <button type="button" id="cfg-generate" ${dis} class="duo-btn bg-tech-card hover:bg-slate-800 border-tech-border text-slate-200 font-bold px-4 py-2 rounded-xl">Gerar a próxima lição agora</button>
            </div>
            <div id="cfg-out" class="text-xs font-mono text-slate-300 space-y-1"></div>
            <div class="pt-2 border-t border-tech-border/60"><p class="font-mono font-bold text-slate-400 text-[11px] uppercase mb-1">Últimos eventos do servidor</p>
                <div class="text-[11px] font-mono text-slate-400 space-y-0.5">${logs.length ? logs.map(l => `<div>${esc(l)}</div>`).join('') : '<div>(nada ainda)</div>'}</div>
                <p class="text-[11px] font-mono text-slate-500 mt-1">Voz usada por último: ${esc(lastVoiceSrc || '—')}</p></div>
        </div>
    </details>`;
    const sel = (id, v) => { const el = document.getElementById(id); if (el && v) { if (![...el.options].some(o => o.value === v)) el.add(new Option(v, v)); el.value = v; } };
    sel('cfg-model', S.model); sel('cfg-thinking', S.thinking || 'high'); sel('cfg-voice-en', S.voiceEn); sel('cfg-voice-pt', S.voicePt);
}
function renderAll() {
    SAY.length = 0; MIC.length = 0; SERIES.length = 0;
    renderTab1(); renderTab2(); renderTab3(); renderTab5(); renderTab6();
    updateHud();
    highlightSpeed();
    audioBarUpdate();
}

/* =====================================================================
 * NAVEGAÇÃO E EVENTOS
 * ===================================================================== */
let currentTab = 'tab1';
function switchTab(id) {
    currentTab = id;
    store.set('efl_last_tab', id);
    ['tab1', 'tab2', 'tab3', 'tab5', 'tab6'].forEach(t => {
        document.getElementById(t).classList.toggle('hidden', t !== id);
    });
    document.querySelectorAll('.tab-btn').forEach(b => {
        const on = b.dataset.tab === id;
        b.classList.toggle('border-duo-green', on); b.classList.toggle('text-duo-green', on);
        b.classList.toggle('border-transparent', !on); b.classList.toggle('text-slate-400', !on);
        if (on) b.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });
    if (id === 'tab6') renderTab6();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
function highlightSpeed() {
    document.querySelectorAll('.speed-btn').forEach(b => {
        const on = Math.abs(parseFloat(b.dataset.speed) - globalSpeed) < 0.03;
        b.classList.toggle('bg-duo-blue/20', on); b.classList.toggle('text-duo-blue', on); b.classList.toggle('border-duo-blue/40', on);
        b.classList.toggle('text-slate-400', !on); b.classList.toggle('border-transparent', !on);
    });
    const sel = document.getElementById('audio-boost-select');
    if (sel) sel.value = String(boostMultiplier);
    const sp = document.getElementById('speed-select');
    if (sp) sp.value = String(globalSpeed);
}

document.addEventListener('click', e => {
    const t = e.target.closest('button, a, [data-xray], [data-close-sheet]');
    if (!t) return;
    const d = t.dataset;
    const inSheet = !!t.closest('#sheet');
    if (inSheet && d.voice === undefined && d.act !== 'install') closeSheet();
    if (d.closeSheet !== undefined) { closeSheet(); return; }
    if (d.flow) { flowGo(d.ftab, d.flow === 'next' ? 1 : -1); return; }
    if (d.reveal) { const x = document.getElementById(d.reveal); if (x) x.classList.toggle('hidden'); return; }
    if (d.say !== undefined) { const s = SAY[+d.say]; if (s) speak(s.text, s.speed, s.lang); e.stopPropagation(); return; }
    if (d.series !== undefined) { const s = SERIES[+d.series]; if (s) playSeries(s.texts, s.label); return; }
    if (d.mic !== undefined) { const m = MIC[+d.mic]; if (m) practiceSpeaking(m.text, m.box); return; }
    if (d.tab) { switchTab(d.tab); return; }
    if (d.speed) { setSpeed(parseFloat(d.speed) || 1); return; }
    if (d.voice) { setVoiceMode(d.voice); return; }
    if (d.focus) { setOutputFocus(d.focus); return; }
    if (d.habit) { habitChecks[d.habit] = !habitChecks[d.habit]; saveSession(); if (habitChecks[d.habit]) addXp(5); refreshPlan(); return; }
    if (d.wordtab !== undefined) {
        const card = t.closest('.glass-card');
        card.querySelectorAll('.word-panel').forEach(p => p.classList.toggle('hidden', p.dataset.wordpanel !== d.wordtab));
        card.querySelectorAll('.word-tab').forEach(b => {
            const on = b.dataset.wordtab === d.wordtab;
            b.className = 'word-tab px-3 py-2 rounded-xl border font-extrabold text-sm ' + (on ? 'bg-duo-amber/20 border-duo-amber/60 text-duo-amber' : 'bg-tech-card border-tech-border text-slate-300');
        });
        return;
    }
    if (d.act === 'sync') { syncNow({ manual: true }); return; }
    if (d.act === 'install') { if (installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; renderSheet(); }); } return; }
    if (d.act === 'config') {
        cfgOpen = true; switchTab('tab6');
        setTimeout(() => { const el = document.getElementById('cfg-details'); if (el) { el.open = true; el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } }, 250);
        return;
    }
    if (d.check !== undefined) { checkWriting(+d.check); return; }
    if (d.usesample !== undefined) { const i = +d.usesample; document.getElementById('w' + i).value = LESSON.writing[i].sample; checkWriting(i, true); speak(LESSON.writing[i].sample); return; }
    if (d.opt !== undefined) { selectAnswer(+d.opt); return; }
    if (d.pair !== undefined) { playBilingualPair(+d.pair); return; }
    if (d.open) { openArchived(d.open); return; }
    if (d.back) { backToCurrent(); return; }
    if (d.togglePt) { document.querySelectorAll('.story-pt').forEach(el => el.classList.toggle('hidden')); return; }
    if (d.xray) { const x = t.querySelector('.story-xray'); if (x) x.classList.toggle('hidden'); return; }
    switch (t.id) {
        case 'menu-btn': openSheet(); break;
        case 'ab-toggle': audioToggle(); break;
        case 'ab-stop': stopAudioAll(); break;
        case 'next-btn': loadQuestion(); if (!quizQueue.length) updateFlowNav('tab1'); break;
        case 'q-listen': if (currentQ !== null && LESSON.quiz[currentQ]) speak(LESSON.quiz[currentQ].audio || LESSON.quiz[currentQ].q); break;
        case 'playlist-btn': togglePlaylist(); break;
        case 'stop-btn': stopAudioAll(); break;
        case 'send-report': sendReport(false); break;
        case 'copy-conv': {
            const txt = (LESSON.conversation || {}).script || '';
            const done = () => toast('📋 Roteiro copiado! Cole no Gemini Live.');
            if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done).catch(() => toast('Selecione o texto e copie manualmente.'));
            else toast('Selecione o texto e copie manualmente.');
            break;
        }
        case 'cfg-link-save': saveLinkUi(); break;
        case 'cfg-save': saveSettingsUi(); break;
        case 'cfg-test': runDiagnose(); break;
        case 'cfg-generate': runGenerateNow(); break;
    }
});
document.addEventListener('change', e => {
    const id = e.target.id;
    if (id === 'speed-select') { setSpeed(parseFloat(e.target.value) || 1); return; }
    if (id === 'audio-boost-select') { boostMultiplier = parseFloat(e.target.value) || 3.5; store.set('efl_boost', boostMultiplier); clearRenderedPairCache(); }
    if (['bi-mode', 'bi-pause', 'bi-inter-pause', 'bi-filter'].includes(id)) {
        const P = store.getJson('efl_pair_opts', {}); P[id] = e.target.value; store.setJson('efl_pair_opts', P);
        clearRenderedPairCache();
    }
    if (id === 'bi-filter') { stopAudioAll(); renderDeckList(); }
    if (id === 'deck-unlock' && hasServer()) run('saveSettings', { deck: { unlock: e.target.checked, notes: document.getElementById('deck-notes').value } }).then(s => { if (BOOT) BOOT.settings = s; toast(e.target.checked ? '🔄 As frases serão atualizadas na próxima lição.' : '🔒 Frases travadas.'); }).catch(() => toast('📴 Sem internet: a escolha vai junto com o próximo relatório.'));
});
let searchTimer = null;
document.addEventListener('input', e => {
    if (e.target.id === 'bi-search') { clearTimeout(searchTimer); searchTimer = setTimeout(renderDeckList, 250); }
    if (/^w\d+$/.test(e.target.id)) { writingSentences[+e.target.id.slice(1)] = e.target.value; saveSession(); }
});
document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && /^w\d+$/.test(e.target.id || '')) { e.preventDefault(); checkWriting(+e.target.id.slice(1)); }
    if (e.key === 'Escape' && sheetIsOpen()) closeSheet();
});
document.addEventListener('blur', e => {
    if (e.target && e.target.id === 'deck-notes' && hasServer() && !isOffline()) run('saveSettings', { deck: { unlock: document.getElementById('deck-unlock').checked, notes: e.target.value } }).then(s => { if (BOOT) BOOT.settings = s; }).catch(() => {});
}, true);

function saveLinkUi() {
    const out = document.getElementById('cfg-out');
    const u = document.getElementById('cfg-api').value.trim();
    const k = document.getElementById('cfg-k').value.trim() || API.k;
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)) { out.innerHTML = '❌ O link do servidor precisa começar com https://script.google.com/ e terminar em /exec.'; return; }
    if (!k || k.length < 16) { out.innerHTML = '❌ Falta o código secreto (está no documento COMECE AQUI).'; return; }
    API.url = u; API.k = k; store.set('efl_api_url', u); store.set('efl_api_k', k);
    out.innerHTML = '⏳ Ligando…';
    syncNow({ manual: true }).then(() => { renderTab6(); const o = document.getElementById('cfg-out'); if (o) o.innerHTML = BOOT ? '✅ Ligado ao servidor.' : '⚠️ Salvei, mas o servidor não respondeu. Confira o link e a internet.'; });
}
async function saveSettingsUi() {
    const out = document.getElementById('cfg-out');
    const payload = {
        geminiKey: document.getElementById('cfg-gemini').value.trim(),
        ttsKey: document.getElementById('cfg-tts').value.trim(),
        model: document.getElementById('cfg-model').value,
        thinking: document.getElementById('cfg-thinking').value,
        voiceEn: document.getElementById('cfg-voice-en').value,
        voicePt: document.getElementById('cfg-voice-pt').value
    };
    try {
        const s = await run('saveSettings', payload);
        if (BOOT) { BOOT.settings = s; kv.set('boot', BOOT); }
        audioCache.clear(); clearRenderedPairCache();
        renderTab6(); document.getElementById('cfg-out').innerHTML = '✅ Configuração salva. Toque em <b>Testar tudo</b>.';
    } catch (e) { out.innerHTML = '❌ ' + esc(e.message || e); }
}
async function runDiagnose() {
    const out = document.getElementById('cfg-out');
    out.innerHTML = '⏳ Testando (uns 10 segundos)…';
    try {
        const lines = await run('diagnose');
        const dev = (deviceVoices || []).filter(v => /^en/i.test(v.lang || '')).length;
        lines.push((dev ? '✅ ' + dev + ' voz(es) em inglês neste aparelho' : '⚠️ Não achei voz em inglês neste aparelho (Android: Configurações → Idioma → Saída de texto para voz → instale "Inglês")'));
        lines.push(SPEECH_REC ? '✅ Reconhecimento de fala disponível (precisa de internet)' : '⚠️ Este navegador não tem reconhecimento de fala (use o Chrome)');
        out.innerHTML = lines.map(l => `<div>${esc(l)}</div>`).join('');
    } catch (e) { out.innerHTML = '❌ ' + esc(e.message || e); }
}
async function runGenerateNow() {
    const out = document.getElementById('cfg-out');
    out.innerHTML = '⏳ Pedindo ao servidor…';
    try { const msg = await run('generateNow'); out.innerHTML = esc(String(msg)); }
    catch (e) { out.innerHTML = '❌ ' + esc(e.message || e); }
}
function prefetchLessonAudio() {
    if (!useGoogleVoice()) return;
    const items = [];
    (LESSON.pillars || []).slice(0, 1).forEach(p => (p.groups || []).forEach(g => (g.items || []).forEach(it => it.en && items.push({ text: it.en, lang: 'en-US' }))));
    ((LESSON.words || [])[0] || { sentences: [] }).sentences.slice(0, 6).forEach(x => items.push({ text: x.en, lang: 'en-US' }));
    fetchTtsMany(items.slice(0, 12)).catch(() => {});
}

/* =====================================================================
 * INÍCIO
 * ===================================================================== */
function renderLoading() {
    document.getElementById('tab1').innerHTML = `<div class="glass-card rounded-2xl p-8 text-center space-y-3"><div class="text-4xl animate-pulse">⏳</div>
        <p class="text-white font-bold">Carregando a lição de hoje…</p><p class="text-xs text-slate-400">Buscando no seu Google Drive (só desta primeira vez).</p></div>`;
}
async function boot() {
    loadSession();
    let cached = null;
    try { cached = await kv.get('boot'); } catch (e) {}
    const lastTab = ['tab1', 'tab2', 'tab3', 'tab5', 'tab6'].includes(store.get('efl_last_tab', 'tab1')) ? store.get('efl_last_tab', 'tab1') : 'tab1';
    currentTab = lastTab;
    if (cached && cached.lesson) { applyBoot(cached); loadSession(); renderAll(); switchTab(lastTab); }
    else if (hasServer() && !isOffline()) { renderLoading(); switchTab('tab1'); }
    else { renderAll(); switchTab('tab1'); }
    lastSyncAt = 0;
    updateNetDot();
    if (SETUP_JUST_DONE) toast('🔗 App ligado ao seu servidor! Agora instale: no Chrome, ⋮ → Instalar app (ou Adicionar à tela inicial).', 7000);
    else if (!hasServer()) toast('Modo demonstração: para salvar e receber lições novas, abra o link do documento COMECE AQUI no seu Drive.', 6000);
    if (hasServer()) await syncNow({ first: true });
}
if ('serviceWorker' in navigator && !IN_GAS && (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
}
document.getElementById('nav-tabs-bar').addEventListener('wheel', e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { e.preventDefault(); e.currentTarget.scrollLeft += e.deltaY; } }, { passive: false });
boot();

</script>
